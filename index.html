<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabalan Restaurant & Cafe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display for Elite Restaurant Menu Style -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif-menu {
            font-family: 'Playfair Display', serif;
        }
        /* Brushed Gold Gradient Accents */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #d97706 50%, #92400e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(217, 119, 6, 0.25);
        }
        /* Toast notification animations */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-in forwards; }
    </style>
</head>
<body class="bg-[#0c0a09] text-stone-200 min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-950/20 via-[#0c0a09] to-black">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Top Luxury Header -->
    <header class="bg-[#141210]/90 backdrop-blur-md text-stone-100 shadow-2xl p-4 sticky top-0 z-40 border-b gold-border">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3.5">
                <div class="p-2.5 bg-amber-500/10 rounded-2xl border gold-border shadow-inner">
                    <i class="fa-solid fa-utensils text-xl text-amber-400"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-serif-menu font-bold tracking-wider gold-gradient-text">KABALAN</h1>
                    <p class="text-[10px] text-amber-400/70 tracking-[0.25em] uppercase font-semibold hidden sm:block">Authentic Lebanese Cuisine & Cafe</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="roleBadge" class="bg-amber-500/10 text-amber-400 text-xs px-3.5 py-1 rounded-full uppercase font-semibold border gold-border tracking-wide">Customer View</span>
                <button onclick="toggleAdminMode()" id="adminToggleBtn" class="bg-stone-900 hover:bg-stone-800 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2 border gold-border text-amber-300 shadow-sm">
                    <i class="fa-solid fa-lock text-[10px]"></i>
                    <span id="adminToggleText">Owner Login</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left 2 Columns: Catalog & Categories -->
        <section class="lg:col-span-2 flex flex-col space-y-4">
            
            <!-- Search & Admin Add Item Bar -->
            <div class="bg-[#141210]/80 backdrop-blur-md p-4 rounded-2xl shadow-xl flex flex-col sm:flex-row gap-3 justify-between items-center border gold-border">
                <div class="relative w-full sm:w-80">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500/50">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="searchBox" oninput="filterProducts()" placeholder="Search authentic dishes, shisha, drinks..." class="w-full pl-10 pr-4 py-2.5 bg-[#0c0a09] border gold-border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-stone-100 placeholder-stone-500">
                </div>
                
                <button id="addProductBtn" onclick="openProductModal()" class="hidden bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold tracking-wide transition flex items-center space-x-2 w-full sm:w-auto justify-center shadow-lg border border-emerald-500/30">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add New Item</span>
                </button>
            </div>

            <!-- Category Filter Tabs -->
            <div class="flex space-x-2.5 overflow-x-auto pb-2 scrollbar-none" id="categoryButtons">
                <button onclick="setCategory('All')" class="cat-btn active bg-amber-500 text-stone-950 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-lg border border-amber-400 transition">All Menu</button>
                <button onclick="setCategory('Lebanese')" class="cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition">🇱🇧 Lebanese Specialties</button>
                <button onclick="setCategory('Fast Food')" class="cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition">🍔 Fast Food & Grills</button>
                <button onclick="setCategory('Desserts')" class="cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition">🍰 Oriental Desserts</button>
                <button onclick="setCategory('Shisha')" class="cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition">💨 Premium Shisha</button>
                <button onclick="setCategory('Cocktails')" class="cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition">🍹 Fresh Cocktails</button>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 overflow-y-auto max-h-[calc(100vh-280px)] p-1">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Right Column: Cart & Summary -->
        <section class="bg-[#141210]/90 backdrop-blur-md rounded-2xl shadow-2xl border gold-border p-5 flex flex-col justify-between h-[calc(100vh-130px)] sticky top-20">
            <div>
                <div class="flex justify-between items-center border-b border-stone-800 pb-3 mb-3">
                    <h2 class="text-lg font-serif-menu font-bold flex items-center space-x-2 text-amber-400">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Current Table Order</span>
                    </h2>
                    <button onclick="clearCart()" class="text-red-400 hover:text-red-300 text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-red-950/40 border border-red-500/20 transition">Clear</button>
                </div>

                <!-- Cart Items List -->
                <div id="cartList" class="overflow-y-auto max-h-[calc(100vh-370px)] divide-y divide-stone-800/80 pr-1">
                    <p class="text-stone-500 text-center py-12 text-sm italic">No items selected yet</p>
                </div>
            </div>

            <!-- Cart Totals & Checkout -->
            <div class="border-t border-stone-800 pt-4 space-y-2 bg-transparent">
                <div class="flex justify-between text-sm text-stone-400">
                    <span>Subtotal</span>
                    <span id="subtotalAmount" class="font-medium text-stone-200">$0.00</span>
                </div>
                <div class="flex justify-between text-sm text-stone-400">
                    <span>Service & Tax (11%)</span>
                    <span id="taxAmount" class="font-medium text-stone-200">$0.00</span>
                </div>
                <div class="flex justify-between text-lg font-serif-menu font-bold text-stone-100 border-t border-stone-800 pt-3">
                    <span>Total Amount</span>
                    <span id="totalAmount" class="gold-gradient-text">$0.00</span>
                </div>

                <button onclick="checkout()" id="checkoutBtn" disabled class="w-full mt-3 bg-stone-900 text-stone-600 font-bold py-3.5 rounded-xl transition cursor-not-allowed border border-stone-800 text-sm tracking-wide">
                    Submit Table Order
                </button>
            </div>
        </section>
    </main>

    <!-- Admin Password Modal -->
    <div id="pinModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#141210] rounded-2xl p-6 w-full max-w-sm shadow-2xl border gold-border text-stone-100">
            <h3 class="text-lg font-serif-menu font-bold mb-2 text-amber-400">Kabalan Management</h3>
            <p class="text-xs text-stone-400 mb-4">Enter owner security credentials to unlock item controls.</p>
            <input type="password" id="adminPinInput" placeholder="Enter Owner PIN" class="w-full bg-[#0c0a09] border gold-border px-3.5 py-2.5 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-100 text-sm">
            <div class="flex justify-end space-x-2">
                <button onclick="closePinModal()" class="px-4 py-2 border border-stone-700 rounded-xl text-xs text-stone-300 hover:bg-stone-900">Cancel</button>
                <button onclick="verifyPin()" class="px-4 py-2 bg-amber-500 text-stone-950 font-bold rounded-xl text-xs hover:bg-amber-400">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#141210] rounded-2xl p-6 w-full max-w-md shadow-2xl border gold-border text-stone-100">
            <h3 id="modalTitle" class="text-lg font-serif-menu font-bold mb-4 text-amber-400">Add New Menu Dish</h3>
            <input type="hidden" id="editIndex" value="-1">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-amber-400/80 mb-1">Item Name</label>
                    <input type="text" id="itemName" class="w-full bg-[#0c0a09] border gold-border px-3.5 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-100" placeholder="e.g. Mixed Grill Platter">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400/80 mb-1">Category</label>
                    <select id="itemCategory" class="w-full bg-[#0c0a09] border gold-border px-3.5 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-100">
                        <option value="Lebanese">Lebanese Specialties</option>
                        <option value="Fast Food">Fast Food & Grills</option>
                        <option value="Desserts">Oriental Desserts</option>
                        <option value="Shisha">Premium Shisha</option>
                        <option value="Cocktails">Fresh Cocktails</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400/80 mb-1">Price ($)</label>
                    <input type="number" step="0.01" id="itemPrice" class="w-full bg-[#0c0a09] border gold-border px-3.5 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-100" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400/80 mb-1">Emoji / Icon Symbol</label>
                    <input type="text" id="itemIcon" class="w-full bg-[#0c0a09] border gold-border px-3.5 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-100" placeholder="e.g. 🍢">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="closeProductModal()" class="px-4 py-2 border border-stone-700 rounded-xl text-xs text-stone-300 hover:bg-stone-900">Cancel</button>
                <button onclick="saveProduct()" class="px-4 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold hover:bg-emerald-600">Save Item</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Default Famous Restaurant Menu Items
        const defaultProducts = [
            // Lebanese Specialties
            { name: "Kabalan Special Mixed Grill", category: "Lebanese", price: 18.50, icon: "🍢" },
            { name: "Hummus Beiruty with Meat", category: "Lebanese", price: 7.00, icon: "🧆" },
            { name: "Traditional Tabbouleh", category: "Lebanese", price: 5.50, icon: "🥗" },
            { name: "Crispy Fattoush with Sumac", category: "Lebanese", price: 5.50, icon: "🥗" },
            { name: "Chicken Shish Tawook Platter", category: "Lebanese", price: 13.00, icon: "🍗" },
            { name: "Meat Kibbeh (4 pcs)", category: "Lebanese", price: 7.50, icon: "🧆" },
            { name: "Spicy Batata Harra", category: "Lebanese", price: 4.50, icon: "🥔" },
            { name: "Authentic Jawaneh (Wings)", category: "Lebanese", price: 6.50, icon: "🍗" },

            // Fast Food & Grills
            { name: "Kabalan Gourmet Burger", category: "Fast Food", price: 9.50, icon: "🍔" },
            { name: "Crispy Zinger Sandwich", category: "Fast Food", price: 8.00, icon: "🥪" },
            { name: "Classic Beef Shawarma Plate", category: "Fast Food", price: 11.50, icon: "🥙" },
            { name: "Loaded Cheddar Fries", category: "Fast Food", price: 5.00, icon: "🍟" },
            { name: "Pepperoni Stone Pizza", category: "Fast Food", price: 12.00, icon: "🍕" },

            // Oriental Desserts
            { name: "Warm Knefeh in Kaak", category: "Desserts", price: 5.00, icon: "🧀" },
            { name: "Assorted Baklava (Plate)", category: "Desserts", price: 6.50, icon: "🍯" },
            { name: "Mafroukeh with Ashta", category: "Desserts", price: 7.50, icon: "🍨" },
            { name: "Nutella Chocolate Crepe", category: "Desserts", price: 6.00, icon: "🥞" },

            // Premium Shisha
            { name: "Double Apples Shisha", category: "Shisha", price: 8.00, icon: "💨" },
            { name: "Lemon Mint Special Shisha", category: "Shisha", price: 8.00, icon: "🍃" },
            { name: "Love 66 Signature Shisha", category: "Shisha", price: 9.50, icon: "💨" },
            { name: "Grape Berry Mint Shisha", category: "Shisha", price: 8.50, icon: "🍇" },

            // Fresh Cocktails & Drinks
            { name: "Avocado Honey Cocktail", category: "Cocktails", price: 7.00, icon: "🥑" },
            { name: "Kabalan Layered Fruit Cocktail", category: "Cocktails", price: 7.50, icon: "🍹" },
            { name: "Refreshing Mint Mojito", category: "Cocktails", price: 5.50, icon: "🍸" },
            { name: "Fresh Mango Juice", category: "Cocktails", price: 4.50, icon: "🥭" },
            { name: "Traditional Arabic Coffee", category: "Cocktails", price: 3.00, icon: "☕" }
        ];

        let products = JSON.parse(localStorage.getItem('kabalan_famous_products')) || defaultProducts;
        let cart = [];
        let currentCategory = 'All';
        let isAdmin = false;

        // Encoded owner PIN: "bdbh1234"
        const ENCODED_PIN = "bdbh1234".split("").map(c => c.charCodeAt(0) + 3);

        function checkPin(input) {
            const encodedInput = input.split("").map(c => c.charCodeAt(0) + 3).join(",");
            return encodedInput === ENCODED_PIN.join(",");
        }

        function saveProductsToStorage() {
            localStorage.setItem('kabalan_famous_products', JSON.stringify(products));
        }

        // Live Toast Notification Popup
        function showNotification(itemName, icon) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = "toast-enter bg-[#141210] text-stone-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border gold-border backdrop-blur-md pointer-events-auto min-w-[260px]";
            toast.innerHTML = `
                <span class="text-2xl p-1 bg-amber-500/10 rounded-xl border gold-border">${icon || '🛒'}</span>
                <div>
                    <h5 class="text-[10px] font-bold text-amber-400 uppercase tracking-widest">Added to Table</h5>
                    <p class="text-xs text-stone-200 font-medium">${itemName}</p>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 2300);
        }

        // Category Filter Tabs
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-[#141210] text-stone-300 hover:bg-stone-900 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap border gold-border transition";
            });
            event.target.className = "cat-btn active bg-amber-500 text-stone-950 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-lg border border-amber-400 transition";
            filterProducts();
        }

        // Render Product Catalog Cards
        function renderProducts(list = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            let filteredList = list;
            if (currentCategory !== 'All') {
                filteredList = list.filter(p => p.category === currentCategory);
            }

            if (filteredList.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-stone-500 py-12 text-sm italic">No dishes found matching your request.</p>`;
                return;
            }

            filteredList.forEach((p) => {
                const originalIndex = products.indexOf(p);
                grid.innerHTML += `
                    <div onclick="addToCart(${originalIndex})" class="bg-[#141210]/70 backdrop-blur-sm p-4 rounded-2xl shadow-xl border gold-border hover:border-amber-500/60 hover:shadow-2xl transition duration-300 cursor-pointer flex flex-col justify-between relative group">
                        ${isAdmin ? `
                            <div class="absolute top-2 right-2 flex space-x-1 opacity-90 z-10">
                                <button onclick="event.stopPropagation(); editProduct(${originalIndex})" class="bg-amber-500/20 text-amber-300 p-1.5 rounded-lg text-xs hover:bg-amber-500/40 border gold-border"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="event.stopPropagation(); deleteProduct(${originalIndex})" class="bg-red-500/20 text-red-300 p-1.5 rounded-lg text-xs hover:bg-red-500/40 border border-red-500/30"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                        <div>
                            <div class="text-3xl mb-2.5">${p.icon || '🍽️'}</div>
                            <span class="text-[9px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full uppercase tracking-wider border gold-border">${p.category}</span>
                            <h4 class="font-serif-menu font-bold text-stone-100 text-sm mt-2 group-hover:text-amber-300 transition">${p.name}</h4>
                        </div>
                        <div class="flex justify-between items-center mt-3 pt-2.5 border-t border-stone-800/80">
                            <span class="gold-gradient-text font-bold text-sm">$${p.price.toFixed(2)}</span>
                            <span class="text-xs bg-amber-500 text-stone-950 font-bold px-2.5 py-1 rounded-lg group-hover:bg-amber-400 transition shadow-md"><i class="fa-solid fa-plus"></i></span>
                        </div>
                    </div>
                `;
            });
        }

        // Search Filter
        function filterProducts() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query);
                const matchesCategory = (currentCategory === 'All') || (p.category === currentCategory);
                return matchesSearch && matchesCategory;
            });
            renderProducts(filtered);
        }

        // Cart Actions
        function addToCart(index) {
            const product = products[index];
            const existing = cart.find(item => item.name === product.name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            showNotification(product.name, product.icon);
            renderCart();
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            const checkoutBtn = document.getElementById('checkoutBtn');
            cartList.innerHTML = '';

            if (cart.length === 0) {
                cartList.innerHTML = `<p class="text-stone-500 text-center py-12 text-sm italic">No items selected yet</p>`;
                checkoutBtn.disabled = true;
                checkoutBtn.className = "w-full mt-3 bg-stone-900 text-stone-600 font-bold py-3.5 rounded-xl transition cursor-not-allowed border border-stone-800 text-sm tracking-wide";
                updateTotals();
                return;
            }

            checkoutBtn.disabled = false;
            checkoutBtn.className = "w-full mt-3 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold py-3.5 rounded-xl transition shadow-xl border border-amber-300 text-sm tracking-wide";

            cart.forEach((item, index) => {
                cartList.innerHTML += `
                    <div class="py-3 flex justify-between items-center">
                        <div>
                            <h4 class="text-sm font-medium text-stone-200">${item.name}</h4>
                            <p class="text-xs text-stone-400">$${item.price.toFixed(2)} each</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="flex items-center border gold-border rounded-xl overflow-hidden bg-[#0c0a09]">
                                <button onclick="updateQty(${index}, -1)" class="px-2 py-1 text-stone-400 hover:bg-stone-800 text-xs">-</button>
                                <span class="px-2 text-xs font-semibold text-stone-200">${item.qty}</span>
                                <button onclick="updateQty(${index}, 1)" class="px-2 py-1 text-stone-400 hover:bg-stone-800 text-xs">+</button>
                            </div>
                            <span class="text-sm font-bold text-amber-400 w-14 text-right">$${(item.price * item.qty).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
            updateTotals();
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const tax = subtotal * 0.11; // 11% Tax
            const total = subtotal + tax;

            document.getElementById('subtotalAmount').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('taxAmount').innerText = `$${tax.toFixed(2)}`;
            document.getElementById('totalAmount').innerText = `$${total.toFixed(2)}`;
        }

        function checkout() {
            alert("Table order successfully submitted to the kitchen at Kabalan Restaurant! Total Bill: " + document.getElementById('totalAmount').innerText);
            cart = [];
            renderCart();
        }

        // Owner Mode Controls
        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('roleBadge').innerText = "Customer View";
                document.getElementById('adminToggleText').innerText = "Owner Login";
                document.querySelector('#adminToggleBtn i').className = "fa-solid fa-lock text-[10px]";
                document.getElementById('addProductBtn').classList.add('hidden');
                renderProducts();
            } else {
                document.getElementById('pinModal').classList.remove('hidden');
                document.getElementById('adminPinInput').value = '';
                document.getElementById('adminPinInput').focus();
            }
        }

        function closePinModal() {
            document.getElementById('pinModal').classList.add('hidden');
        }

        function verifyPin() {
            const enteredPin = document.getElementById('adminPinInput').value;
            if (checkPin(enteredPin)) {
                isAdmin = true;
                closePinModal();
                document.getElementById('roleBadge').innerText = "Owner Mode";
                document.getElementById('adminToggleText').innerText = "Logout Owner";
                document.querySelector('#adminToggleBtn i').className = "fa-solid fa-lock-open text-[10px]";
                document.getElementById('addProductBtn').classList.remove('hidden');
                renderProducts();
            } else {
                alert("Incorrect PIN! Please try again.");
            }
        }

        // Product Management
        function openProductModal() {
            document.getElementById('modalTitle').innerText = "Add New Menu Dish";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
            document.getElementById('itemIcon').value = "";
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('modalTitle').innerText = "Edit Menu Item";
            document.getElementById('editIndex').value = index;
            document.getElementById('itemName').value = p.name;
            document.getElementById('itemCategory').value = p.category;
            document.getElementById('itemPrice').value = p.price;
            document.getElementById('itemIcon').value = p.icon;
            document.getElementById('productModal').classList.remove('hidden');
        }

        function saveProduct() {
            const name = document.getElementById('itemName').value.trim();
            const category = document.getElementById('itemCategory').value;
            const price = parseFloat(document.getElementById('itemPrice').value);
            const icon = document.getElementById('itemIcon').value.trim() || '🍽️';
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!name || isNaN(price) || price < 0) {
                alert("Please enter a valid item name and price.");
                return;
            }

            if (editIndex === -1) {
                products.push({ name, category, price, icon });
            } else {
                products[editIndex] = { name, category, price, icon };
            }

            saveProductsToStorage();
            closeProductModal();
            renderProducts();
        }

        function deleteProduct(index) {
            if (confirm(`Delete "${products[index].name}" from the restaurant menu?`)) {
                products.splice(index, 1);
                saveProductsToStorage();
                renderProducts();
            }
        }

        // Press Enter for PIN verification
        document.getElementById('adminPinInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyPin();
        });

        // Initial Load
        renderProducts();
    </script>
</body>
</html>
